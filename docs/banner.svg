<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="reelkit banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#fff">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>
  <!-- film strip -->
  <g transform="translate(70 90)">
    <rect width="150" height="140" rx="14" fill="#111827" stroke="url(#accent)" stroke-width="4"/>
    <g fill="#f97316">
      <rect x="12" y="12" width="14" height="14" rx="3"/><rect x="12" y="42" width="14" height="14" rx="3"/>
      <rect x="12" y="72" width="14" height="14" rx="3"/><rect x="12" y="102" width="14" height="14" rx="3"/>
      <rect x="124" y="12" width="14" height="14" rx="3"/><rect x="124" y="42" width="14" height="14" rx="3"/>
      <rect x="124" y="72" width="14" height="14" rx="3"/><rect x="124" y="102" width="14" height="14" rx="3"/>
    </g>
    <path d="M60 45L105 70L60 95Z" fill="url(#accent)"/>
  </g>
  <text x="260" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="#fff">reelkit</text>
  <text x="262" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#e9d5ff">Raw talking-head clip → captioned reel, driven by Claude Code</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#fff">
    <rect x="262" y="228" width="150" height="38" rx="19" fill="#ffffff22"/><text x="287" y="254">✂️ silence cut</text>
    <rect x="426" y="228" width="170" height="38" rx="19" fill="#ffffff22"/><text x="449" y="254">🎙️ transcript</text>
    <rect x="610" y="228" width="150" height="38" rx="19" fill="#ffffff22"/><text x="634" y="254">💬 captions</text>
    <rect x="774" y="228" width="150" height="38" rx="19" fill="#ffffff22"/><text x="798" y="254">🤖 MCP</text>
  </g>
