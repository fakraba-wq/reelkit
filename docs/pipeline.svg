<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="reelkit pipeline">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f97316"/>
    </marker>
    <style>
      .box{fill:#111827;stroke:#f97316;stroke-width:2.5}
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#f9fafb}
      .h{font-size:22px;font-weight:700}
      .s{font-size:15px;fill:#9ca3af}
      .f{font-family:Consolas,monospace;font-size:14px;fill:#fbbf24}
    </style>
  </defs>
  <rect width="1200" height="380" rx="20" fill="#0b1020"/>
  <text x="600" y="48" text-anchor="middle" class="t h" font-size="26">How reelkit turns one raw clip into a reel</text>

  <rect class="box" x="30" y="100" width="190" height="130" rx="14"/>
  <text x="125" y="140" text-anchor="middle" class="t h">🎬 raw.mp4</text>
  <text x="125" y="168" text-anchor="middle" class="t s">9:16 talking head</text>
  <text x="125" y="190" text-anchor="middle" class="t s">dead air, ums, pauses</text>

  <rect class="box" x="275" y="100" width="210" height="130" rx="14"/>
  <text x="380" y="140" text-anchor="middle" class="t h">✂️ cut_silence</text>
  <text x="380" y="168" text-anchor="middle" class="t s">ffmpeg silencedetect</text>
  <text x="380" y="190" text-anchor="middle" class="t s">trim + concat, padded</text>

  <rect class="box" x="540" y="100" width="210" height="130" rx="14"/>
  <text x="645" y="140" text-anchor="middle" class="t h">🎙️ transcribe</text>
  <text x="645" y="168" text-anchor="middle" class="t s">Groq Whisper large-v3</text>
  <text x="645" y="190" text-anchor="middle" class="t s">word-level timestamps</text>

  <rect class="box" x="805" y="100" width="190" height="130" rx="14"/>
  <text x="900" y="140" text-anchor="middle" class="t h">💬 captions</text>
  <text x="900" y="168" text-anchor="middle" class="t s">1-3 word chunks</text>
  <text x="900" y="190" text-anchor="middle" class="t s">SRT + JSON, RTL-safe</text>

  <rect class="box" x="1040" y="100" width="130" height="130" rx="14"/>
  <text x="1105" y="140" text-anchor="middle" class="t h">🎞️ reel</text>
  <text x="1105" y="168" text-anchor="middle" class="t s">Remotion</text>
  <text x="1105" y="190" text-anchor="middle" class="t s">render</text>

  <g stroke="#f97316" stroke-width="3" marker-end="url(#arr)">
    <path d="M220 165H270"/><path d="M485 165H535"/><path d="M750 165H800"/><path d="M995 165H1035"/>
  </g>

  <text x="125" y="262" text-anchor="middle" class="f">input</text>
  <text x="380" y="262" text-anchor="middle" class="f">tight.mp4</text>
  <text x="645" y="262" text-anchor="middle" class="f">words.json</text>
  <text x="900" y="262" text-anchor="middle" class="f">captions.json</text>
  <text x="1105" y="262" text-anchor="middle" class="f">reel.mp4</text>

  <rect x="30" y="296" width="1140" height="56" rx="12" fill="#1f2937"/>
  <text x="600" y="330" text-anchor="middle" class="t" font-size="18">🤖 Claude Code runs every step through the <tspan fill="#fbbf24" font-family="Consolas,monospace">talking-head-reel</tspan> skill and checks the result frame by frame</text>
</svg>
